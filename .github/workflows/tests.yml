name: Tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Compile package
        run: python -m compileall -q vesiclescope

      - name: Run unit tests
        run: python -m unittest discover -s tests -v


  biofvm-diffusion-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch pinned PhysiCell source
        run: bash scripts/fetch-physicell.sh

      - name: Build BioFVM benchmark
        run: make -f native/biofvm_benchmark/Makefile benchmark

      - name: Verify diffusion against analytical solution
        run: make -f native/biofvm_benchmark/Makefile run

      - name: Build contract-driven BioFVM runner
        run: make -f native/biofvm_benchmark/Makefile runner

      - name: Verify transport and localized release through Python adapter
        env:
          VESICLESCOPE_BIOFVM_RUNNER: build/native/biofvm_transport_runner
        run: python -m unittest discover -s tests -p test_biofvm_integration.py -v
