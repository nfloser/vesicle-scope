name: Tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install --disable-pip-version-check .

      - name: Compile package
        run: python -m compileall -q vesiclescope

      - name: Smoke-test installed CLI
        run: |
          vesiclescope --version
          vesiclescope --help
          vesiclescope examples
          vesiclescope engine status
          vesiclescope experiment export-example diffusion-uptake-baseline --output build/example-experiment.json
          vesiclescope experiment validate build/example-experiment.json
          vesiclescope experiment inspect build/example-experiment.json

      - name: Verify installed UI asset
        run: |
          cd /tmp
          python - <<'PY'
          from importlib import resources
          html = resources.files("vesiclescope.ui").joinpath("static/index.html").read_text(encoding="utf-8")
          assert "VesicleScope" in html
          assert "not experimental evidence" in html
          PY

      - name: Syntax-check packaged browser client
        run: |
          python - <<'PY'
          from importlib import resources
          from pathlib import Path

          html = resources.files("vesiclescope.ui").joinpath("static/index.html").read_text(encoding="utf-8")
          if "<script>" not in html or "</script>" not in html:
              raise SystemExit("packaged UI does not contain the expected inline script")
          script = html.split("<script>", 1)[1].rsplit("</script>", 1)[0]
          Path("build").mkdir(exist_ok=True)
          Path("build/ui-inline.js").write_text(script, encoding="utf-8", newline="\n")
          PY
          node --check build/ui-inline.js

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Install optional measured-data reader and test synthetic workbook audits
        run: |
          python -m pip install --disable-pip-version-check '.[data]'
          python -m unittest discover -s tests -p test_measured_mucus_data.py -v


  package-wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip wheel --disable-pip-version-check --no-deps . --wheel-dir build/dist
          test "$(find build/dist -name 'vesicle_scope-*.whl' | wc -l)" -eq 1

      - name: Install wheel into a clean virtual environment
        run: |
          python -m venv build/package-venv
          WHEEL="$(find build/dist -name 'vesicle_scope-*.whl' -print -quit)"
          build/package-venv/bin/python -m pip install --disable-pip-version-check "$WHEEL"

      - name: Verify installed dependency consistency
        run: build/package-venv/bin/python -m pip check

      - name: Verify package contents and installed product
        run: |
          build/package-venv/bin/vesiclescope --version
          build/package-venv/bin/vesiclescope --help
          build/package-venv/bin/vesiclescope examples
          build/package-venv/bin/vesiclescope engine status
          build/package-venv/bin/vesiclescope experiment export-example diffusion-uptake-baseline --output build/release-example.json
          build/package-venv/bin/vesiclescope experiment validate build/release-example.json
          build/package-venv/bin/python - <<'PY'
          from importlib import metadata, resources
          import vesiclescope

          assert vesiclescope.__version__ == metadata.version("vesicle-scope")
          assert vesiclescope.__version__

          html = resources.files("vesiclescope.ui").joinpath("static/index.html")
          assert html.is_file()
          assert "not experimental evidence" in html.read_text(encoding="utf-8")

          runner_source = resources.files("vesiclescope.engines.native").joinpath("transport_runner.cpp")
          assert runner_source.is_file()
          assert runner_source.stat().st_size > 1000
          PY

      - name: Upload wheel candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vesiclescope-wheel
          path: build/dist/*.whl
          if-no-files-found: error


  biofvm-diffusion-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch pinned PhysiCell source
        run: bash scripts/fetch-physicell.sh

      - name: Build BioFVM benchmark
        run: make -f native/biofvm_benchmark/Makefile benchmark

      - name: Verify diffusion against analytical solution
        run: make -f native/biofvm_benchmark/Makefile run

      - name: Install VesicleScope for engine setup
        run: python -m pip install --disable-pip-version-check .

      - name: Build contract-driven BioFVM runner through installed CLI
        run: >-
          vesiclescope engine build
          --physicell-dir .deps/physicell
          --no-fetch
          --output build/native/biofvm_transport_runner

      - name: Verify transport, finite recipients, fields and populations
        env:
          VESICLESCOPE_BIOFVM_RUNNER: build/native/biofvm_transport_runner
        run: |
          python -m unittest discover -s tests -p test_biofvm_integration.py -v
          python -m unittest discover -s tests -p test_population_transport_integration.py -v

      - name: Exercise local workspace end to end
        env:
          VESICLESCOPE_BIOFVM_RUNNER: build/native/biofvm_transport_runner
          VESICLESCOPE_REVISION: ${{ github.sha }}
        run: python -m unittest discover -s tests -p test_interactive_workspace_e2e.py -v

      - name: Generate deterministic donor-boundary run bundle
        env:
          VESICLESCOPE_BIOFVM_RUNNER: build/native/biofvm_transport_runner
          VESICLESCOPE_REVISION: ${{ github.sha }}
        run: >-
          python -m scripts.generate_donor_boundary_bundle
          --output build/runs/donor-boundary-run.json

      - name: Verify durable run bundle
        run: |
          test -s build/runs/donor-boundary-run.json
          grep -F '"schema": "vesiclescope.simulation-run"' build/runs/donor-boundary-run.json
          grep -F '"version": 1' build/runs/donor-boundary-run.json
          grep -F '"payload_sha256":' build/runs/donor-boundary-run.json
          ! grep -F '"created_at"' build/runs/donor-boundary-run.json

      - name: Upload donor-boundary run bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vesiclescope-synthetic-donor-boundary-run
          path: build/runs/donor-boundary-run.json
          if-no-files-found: error

      - name: Install VesicleScope with figure support
        run: python -m pip install --disable-pip-version-check '.[figures]'

      - name: Regenerate a stored-run overview without BioFVM execution
        run: >-
          vesiclescope run-bundle figure
          build/runs/donor-boundary-run.json
          --output build/runs/donor-boundary-run.svg

      - name: Verify stored-run overview provenance labels
        run: |
          test -s build/runs/donor-boundary-run.svg
          grep -F "VesicleScope stored-run overview" build/runs/donor-boundary-run.svg
          grep -F "synthetic benchmark; not experimental evidence" build/runs/donor-boundary-run.svg
          grep -F "${{ github.sha }}" build/runs/donor-boundary-run.svg

      - name: Run synthetic diffusion × uptake factor experiment through CLI
        run: >-
          vesiclescope run diffusion-uptake-factor
          --runner build/native/biofvm_transport_runner
          --revision ${{ github.sha }}
          --output-dir build/diffusion-uptake

      - name: Execute an external experiment through the installed CLI
        run: |
          vesiclescope experiment export-example diffusion-uptake-baseline --output build/external-experiment.json
          vesiclescope experiment validate build/external-experiment.json
          vesiclescope experiment run build/external-experiment.json \
            --runner build/native/biofvm_transport_runner \
            --revision ${{ github.sha }} \
            --grid-spacing-micron 10 \
            --time-step-min 0.1 \
            --output build/external-run.json
          vesiclescope run-bundle inspect build/external-run.json
          vesiclescope run-bundle compare build/external-run.json build/external-run.json

      - name: Verify external run bundle
        run: |
          test -s build/external-run.json
          grep -F '"schema": "vesiclescope.simulation-run"' build/external-run.json
          grep -F '"payload_sha256":' build/external-run.json

      - name: Execute an explicit two-member experiment batch
        env:
          VESICLESCOPE_BIOFVM_RUNNER: build/native/biofvm_transport_runner
          VESICLESCOPE_REVISION: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from vesiclescope.experiment_files import write_experiment_document
          from vesiclescope.scenarios import diffusion_uptake_factor_conditions

          Path("build/batch-inputs").mkdir(parents=True, exist_ok=True)
          conditions = diffusion_uptake_factor_conditions()
          write_experiment_document(Path("build/batch-inputs/member-a.json"), conditions[0].experiment)
          write_experiment_document(Path("build/batch-inputs/member-b.json"), conditions[1].experiment)
          PY
          vesiclescope experiment run-batch \
            build/batch-inputs/member-a.json \
            build/batch-inputs/member-b.json \
            --runner "$VESICLESCOPE_BIOFVM_RUNNER" \
            --revision "$VESICLESCOPE_REVISION" \
            --grid-spacing-micron 10 \
            --time-step-min 0.1 \
            --output-dir build/explicit-batch
          test -s build/explicit-batch/batch-manifest.json
          test "$(find build/explicit-batch -name '*.run.json' | wc -l)" -eq 2
          grep -F '"schema": "vesiclescope.experiment-batch"' build/explicit-batch/batch-manifest.json
          grep -F 'no sampling or biological distribution implied' build/explicit-batch/batch-manifest.json
          mapfile -t RUNS < <(find build/explicit-batch -name '*.run.json' | sort)
          vesiclescope run-bundle ensemble "${RUNS[@]}" > build/explicit-batch/ensemble-summary.txt
          grep -F 'empirical stored-run ensemble; not a confidence interval' build/explicit-batch/ensemble-summary.txt
          grep -F 'member_count: 2' build/explicit-batch/ensemble-summary.txt

      - name: Upload external experiment run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vesiclescope-external-experiment-run
          path: |
            build/external-experiment.json
            build/external-run.json
          if-no-files-found: error

      - name: Verify diffusion × uptake artefacts
        run: |
          test -s build/diffusion-uptake/summary.json
          test -s build/diffusion-uptake/diffusion-uptake.svg
          test "$(find build/diffusion-uptake/runs -name '*.json' | wc -l)" -eq 9
          grep -F '"schema": "vesiclescope.synthetic-diffusion-uptake-factor-summary"' build/diffusion-uptake/summary.json
          grep -F '"scientific_status": "synthetic_benchmark"' build/diffusion-uptake/summary.json
          grep -F "Synthetic diffusion × uptake factor experiment" build/diffusion-uptake/diffusion-uptake.svg
          grep -F "not experimental evidence" build/diffusion-uptake/diffusion-uptake.svg

      - name: Upload diffusion × uptake experiment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vesiclescope-synthetic-diffusion-uptake-factor-experiment
          path: build/diffusion-uptake
          if-no-files-found: error


  population-figure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned figure renderer
        run: python -m pip install --disable-pip-version-check -r requirements-figures.txt

      - name: Fetch pinned PhysiCell source
        run: bash scripts/fetch-physicell.sh

      - name: Build contract-driven BioFVM runner
        run: make -f native/biofvm_benchmark/Makefile runner

      - name: Verify headless figure rendering
        env:
          VESICLESCOPE_BIOFVM_RUNNER: build/native/biofvm_transport_runner
        run: |
          python -m unittest discover -s tests -p test_population_figure_render.py -v
          python -m unittest discover -s tests -p test_donor_boundary_figure_render.py -v
          python -m unittest discover -s tests -p test_stored_run_figure.py -v

      - name: Generate reviewed synthetic population figure
        env:
          VESICLESCOPE_BIOFVM_RUNNER: build/native/biofvm_transport_runner
        run: >-
          python -m scripts.generate_population_figure
          --output build/figures/recipient-count.svg

      - name: Generate reviewed donor-boundary figure
        env:
          VESICLESCOPE_BIOFVM_RUNNER: build/native/biofvm_transport_runner
        run: >-
          python -m scripts.generate_donor_boundary_figure
          --output build/figures/donor-boundary-profile.svg

      - name: Verify inspectable scientific labels
        run: |
          test -s build/figures/recipient-count.svg
          grep -F "Synthetic fixed-grid verification" build/figures/recipient-count.svg
          grep -F "recipient/mm^2" build/figures/recipient-count.svg
          grep -F "particle_equivalent/micron^3" build/figures/recipient-count.svg
          grep -F "not experimental evidence" build/figures/recipient-count.svg

          test -s build/figures/donor-boundary-profile.svg
          grep -F "Synthetic donor-boundary transport verification" build/figures/donor-boundary-profile.svg
          grep -F "5 micron public-code bins" build/figures/donor-boundary-profile.svg
          grep -F "10 micron paper-described zones" build/figures/donor-boundary-profile.svg
          grep -F "simulated concentration" build/figures/donor-boundary-profile.svg
          grep -F "not experimental evidence" build/figures/donor-boundary-profile.svg

      - name: Upload population figure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vesiclescope-synthetic-population-figure
          path: build/figures/recipient-count.svg
          if-no-files-found: error

      - name: Upload donor-boundary figure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vesiclescope-synthetic-donor-boundary-figure
          path: build/figures/donor-boundary-profile.svg
          if-no-files-found: error

  windows-native-product:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify Windows GNU toolchain
        shell: pwsh
        run: |
          git --version
          g++ --version

      - name: Install VesicleScope
        shell: pwsh
        run: python -m pip install --disable-pip-version-check .

      - name: Verify Windows dependency consistency
        shell: pwsh
        run: python -m pip check

      - name: Fetch reviewed PhysiCell release
        shell: pwsh
        run: git clone --quiet --depth 1 --branch 1.14.2 https://github.com/MathCancer/PhysiCell.git .deps/physicell

      - name: Build pinned BioFVM runner through installed product
        shell: pwsh
        run: |
          vesiclescope engine build --physicell-dir .deps/physicell --no-fetch --output build/native/biofvm_transport_runner.exe
          if (-not (Test-Path build/native/biofvm_transport_runner.exe)) { throw "runner was not created" }

      - name: Execute reviewed baseline on Windows
        shell: pwsh
        env:
          VESICLESCOPE_REVISION: ${{ github.sha }}
        run: |
          vesiclescope experiment export-example diffusion-uptake-baseline --output build/windows-baseline.json
          vesiclescope experiment run build/windows-baseline.json --runner build/native/biofvm_transport_runner.exe --revision $env:VESICLESCOPE_REVISION --grid-spacing-micron 10 --time-step-min 0.1 --output build/windows-baseline.run.json
          vesiclescope run-bundle inspect build/windows-baseline.run.json
